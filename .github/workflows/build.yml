name: Build Narzo 20 CDC modules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: debian:sid@sha256:e276677157e13bc51ea5b8651f54ad28883f503cc37b3e3af2c4b6cc2f4efe7b
    steps:
      - name: Install Linux build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            clang-21 llvm-21 lld-21 make gcc g++ bc bison flex \
            libssl-dev libelf-dev python3 git ca-certificates curl \
            xz-utils cpio perl kmod
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test ABI rejection checks
        run: python3 -m unittest discover -s tests -v
      - name: Prepare pinned source
        run: bash scripts/prepare.sh
      - name: Build and verify modules
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build.sh 2>&1 | tee build.log
      - name: Upload verified modules
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: narzo20-cdc-modules-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-diagnostics-${{ github.run_id }}
          path: |
            build.log
            .build/config-delta.txt
          if-no-files-found: ignore
          retention-days: 7
